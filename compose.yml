services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belajar
      POSTGRES_PASSWORD: belajar
      POSTGRES_DB: belajar_api
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U belajar -d belajar_api"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://belajar:belajar@postgres:5432/belajar_api?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
