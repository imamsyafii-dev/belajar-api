services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belajar
      POSTGRES_PASSWORD: belajar
      POSTGRES_DB: belajar_api
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U belajar -d belajar_api"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
